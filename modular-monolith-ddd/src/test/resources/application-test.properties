spring.datasource.url=jdbc:h2:mem:redsalud-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.locations=classpath:db/migration,classpath:db/local

redsalud.legacy.db.url=jdbc:h2:mem:legacy-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;INIT=RUNSCRIPT FROM 'classpath:legacy/legacy-local.sql'
redsalud.legacy.db.user=sa
redsalud.legacy.db.password=

# En las pruebas el relevo del outbox se invoca a mano, para controlar cuándo llegan los eventos.
redsalud.outbox.auto-relay=false

redsalud.aws.region=us-east-1
redsalud.aws.local-credentials=true
redsalud.s3.attachments-bucket=redsalud-attachments-test
redsalud.s3.attachments-kms-key=alias/redsalud-attachments-test
