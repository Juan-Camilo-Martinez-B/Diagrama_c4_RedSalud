# Perfil local: todo en memoria con H2 en modo PostgreSQL, sin AWS. Arranque:
#   mvn spring-boot:run -Dspring-boot.run.profiles=local
spring.datasource.url=jdbc:h2:mem:redsalud;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.locations=classpath:db/migration,classpath:db/local

# Legado simulado: H2 en memoria con el esquema de referencia y datos de ejemplo.
redsalud.legacy.db.url=jdbc:h2:mem:legacy;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;INIT=RUNSCRIPT FROM 'classpath:legacy/legacy-local.sql'
redsalud.legacy.db.user=sa
redsalud.legacy.db.password=

# Adjuntos: se firman URLs con credenciales ficticias (sin red).
redsalud.aws.region=us-east-1
redsalud.aws.local-credentials=true
redsalud.s3.attachments-bucket=redsalud-attachments-local
redsalud.s3.attachments-kms-key=alias/redsalud-attachments-local
