spring.application.name=modular-monolith-ddd

# Base principal: Aurora PostgreSQL (ADR-01). Credenciales por variables de entorno, nunca en el repositorio.
spring.datasource.url=${REDSALUD_DB_URL}
spring.datasource.username=${REDSALUD_DB_USER}
spring.datasource.password=${REDSALUD_DB_PASSWORD}
spring.flyway.locations=classpath:db/migration

# ORM: Spring Data JPA. Flyway es dueño del esquema; Hibernate no lo genera.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Base de solo lectura del legado (Caso §3).
redsalud.legacy.db.url=${REDSALUD_LEGACY_URL}
redsalud.legacy.db.user=${REDSALUD_LEGACY_USER:}
redsalud.legacy.db.password=${REDSALUD_LEGACY_PASSWORD:}
# TTL de la copia de lectura del historial y job nocturno (requiere el cliente SOAP, pendiente de WSDL).
redsalud.legacy.ttl=PT24H
redsalud.legacy.job.enabled=false
redsalud.legacy.job.cron=0 0 2 * * *

# Outbox: cada cuánto se releva al bus y cuántos mensajes por vuelta.
redsalud.outbox.auto-relay=true
redsalud.outbox.interval=PT2S
redsalud.outbox.batch-size=100

# Zona con la que la analítica asigna el mes de cada evento.
redsalud.time-zone=UTC

# Adaptadores: local (sin AWS) por defecto; el perfil aws los cambia a SQS, S3 y Cognito.
redsalud.messaging.type=local
redsalud.pharmacy.type=local
redsalud.audit.type=local
redsalud.security.cognito=false

# Adjuntos en S3 con KMS (también en local se firman URLs, sin tocar la red).
redsalud.aws.region=${REDSALUD_AWS_REGION}
redsalud.s3.attachments-bucket=${REDSALUD_S3_ATTACHMENTS}
redsalud.s3.attachments-kms-key=${REDSALUD_KMS_ATTACHMENTS}
redsalud.s3.url-validity=PT10M
