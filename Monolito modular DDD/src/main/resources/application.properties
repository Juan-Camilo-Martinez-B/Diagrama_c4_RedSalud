spring.application.name=monolito-modular

# Base principal: Aurora PostgreSQL (ADR-01). Credenciales por variables de entorno, nunca en el repositorio.
spring.datasource.url=${REDSALUD_BD_URL}
spring.datasource.username=${REDSALUD_BD_USUARIO}
spring.datasource.password=${REDSALUD_BD_CLAVE}
spring.flyway.locations=classpath:db/migration

# Base de solo lectura del legado (Caso §3).
redsalud.legado.bd.url=${REDSALUD_LEGADO_URL}
redsalud.legado.bd.usuario=${REDSALUD_LEGADO_USUARIO:}
redsalud.legado.bd.clave=${REDSALUD_LEGADO_CLAVE:}
# TTL de la copia de lectura del historial y job nocturno (requiere el cliente SOAP, pendiente de WSDL).
redsalud.legado.ttl=PT24H
redsalud.legado.job.habilitado=false
redsalud.legado.job.cron=0 0 2 * * *

# Outbox: cada cuánto se releva al bus y cuántos mensajes por vuelta.
redsalud.outbox.relevo-automatico=true
redsalud.outbox.intervalo=PT2S
redsalud.outbox.lote=100

# Zona con la que Analítica asigna el mes de cada evento.
redsalud.zona-horaria=UTC

# Adaptadores: local (sin AWS) por defecto; el perfil aws los cambia a SQS, S3 y Cognito.
redsalud.mensajeria.tipo=local
redsalud.farmacia.tipo=local
redsalud.auditoria.tipo=local
redsalud.seguridad.cognito=false

# Adjuntos en S3 con KMS (también en local se firman URLs, sin tocar la red).
redsalud.aws.region=${REDSALUD_AWS_REGION}
redsalud.s3.bucket-adjuntos=${REDSALUD_S3_ADJUNTOS}
redsalud.s3.kms-clave-adjuntos=${REDSALUD_KMS_ADJUNTOS}
redsalud.s3.vigencia-url=PT10M
