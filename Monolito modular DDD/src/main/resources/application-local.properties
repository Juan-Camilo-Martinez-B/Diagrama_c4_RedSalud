# Perfil local: todo en memoria con H2 en modo PostgreSQL, sin AWS. Arranque:
#   mvn spring-boot:run -Dspring-boot.run.profiles=local
spring.datasource.url=jdbc:h2:mem:redsalud;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.locations=classpath:db/migration,classpath:db/local

# Legado simulado: H2 en memoria con el esquema de referencia y datos de ejemplo.
redsalud.legado.bd.url=jdbc:h2:mem:legado;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;INIT=RUNSCRIPT FROM 'classpath:legado/legado-local.sql'
redsalud.legado.bd.usuario=sa
redsalud.legado.bd.clave=

# Adjuntos: se firman URLs con credenciales ficticias (sin red). Para subir de verdad, apunte
# redsalud.aws.endpoint a un emulador de S3.
redsalud.aws.region=us-east-1
redsalud.aws.credenciales-locales=true
redsalud.s3.bucket-adjuntos=redsalud-adjuntos-local
redsalud.s3.kms-clave-adjuntos=alias/redsalud-adjuntos-local
