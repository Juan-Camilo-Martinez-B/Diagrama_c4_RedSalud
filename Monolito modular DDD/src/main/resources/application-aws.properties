# Perfil aws: todo en la ÚNICA región del despliegue (residencia del dato, ADR-05).
#   SPRING_PROFILES_ACTIVE=aws
# Las credenciales salen del rol de la tarea/instancia (cadena por defecto de AWS), nunca de aquí.

# Bus de eventos: outbox -> SQS FIFO (orden por agregado) -> consumidores idempotentes.
redsalud.mensajeria.tipo=sqs
redsalud.sqs.cola-eventos-url=${REDSALUD_SQS_EVENTOS}
redsalud.sqs.espera-segundos=10
redsalud.sqs.intervalo-recepcion=PT1S
# El receptor de SQS hace long polling: el relevo y los jobs necesitan sus propios hilos.
spring.task.scheduling.pool.size=4

# Farmacia: cola SQS FIFO (eventual hacia la farmacia).
redsalud.farmacia.tipo=sqs
redsalud.sqs.cola-farmacia-url=${REDSALUD_SQS_FARMACIA}

# Auditoría: S3 Object Lock en modo compliance (ADR-04).
redsalud.auditoria.tipo=s3
redsalud.s3.bucket-auditoria=${REDSALUD_S3_AUDITORIA}
# SUPUESTO: el caso pide «retención larga y legal» sin decir cuánta; se exige definirla explícitamente.
redsalud.auditoria.retencion=${REDSALUD_AUDITORIA_RETENCION}

# Identidad: JWT emitidos por el user pool de Amazon Cognito.
redsalud.seguridad.cognito=true
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://cognito-idp.${REDSALUD_AWS_REGION}.amazonaws.com/${REDSALUD_COGNITO_USER_POOL}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://cognito-idp.${REDSALUD_AWS_REGION}.amazonaws.com/${REDSALUD_COGNITO_USER_POOL}/.well-known/jwks.json
