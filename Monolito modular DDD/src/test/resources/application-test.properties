spring.datasource.url=jdbc:h2:mem:redsalud-prueba;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.locations=classpath:db/migration,classpath:db/local

redsalud.legado.bd.url=jdbc:h2:mem:legado-prueba;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;INIT=RUNSCRIPT FROM 'classpath:legado/legado-local.sql'
redsalud.legado.bd.usuario=sa
redsalud.legado.bd.clave=

# En las pruebas el relevo del outbox se invoca a mano, para controlar cuándo llegan los eventos.
redsalud.outbox.relevo-automatico=false

redsalud.aws.region=us-east-1
redsalud.aws.credenciales-locales=true
redsalud.s3.bucket-adjuntos=redsalud-adjuntos-prueba
redsalud.s3.kms-clave-adjuntos=alias/redsalud-adjuntos-prueba
